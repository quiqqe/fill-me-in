<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <filter id="ink" filterUnits="userSpaceOnUse" x="0" y="0" width="1024" height="1024">
      <feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="2" seed="7" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="9" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
  </defs>
  
  <g filter="url(#ink)" stroke="#E6EDF3" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- head behind the door edge -->
    <g>
      <ellipse cx="600" cy="430" rx="250" ry="270" fill="#0D1117" stroke-width="26"/>
      <!-- messy hair -->
      <path d="M372 330 Q360 190 500 150 Q560 135 610 150" stroke-width="24"/>
      <path d="M430 175 Q440 110 400 80" stroke-width="22"/>
      <path d="M470 160 Q500 95 470 55" stroke-width="22"/>
      <path d="M515 152 Q560 100 560 70" stroke-width="22"/>
      <!-- raised eyebrow -->
      <path d="M440 330 Q490 285 545 310" stroke-width="22"/>
      <!-- eye looking at you -->
      <ellipse cx="500" cy="400" rx="44" ry="52" fill="#0D1117" stroke-width="20"/>
      <circle cx="514" cy="410" r="20" fill="#E6EDF3" stroke="none"/>
      <!-- half mouth, unsure -->
      <path d="M462 568 Q505 552 560 572" stroke-width="20"/>
    </g>
    <!-- door: solid slab -->
    <path d="M600 40 L990 40 L990 990 L600 990 Z" fill="#E6EDF3" stroke-width="18"/>
    <!-- floor -->
    <path d="M40 990 L600 990" stroke-width="18"/>
    <!-- fingers gripping the door edge -->
    <g fill="#0D1117" stroke-width="18">
      <rect x="560" y="610" width="90" height="46" rx="23"/>
      <rect x="566" y="660" width="92" height="46" rx="23"/>
      <rect x="570" y="710" width="86" height="46" rx="23"/>
      <rect x="576" y="760" width="74" height="44" rx="22"/>
    </g>
  </g>
</svg>
